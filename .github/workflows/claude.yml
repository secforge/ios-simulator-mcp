name: Claude PR Assistant

# Thin caller: delegates to the central reusable workflow in secforge/github.
# All logic + the model live there; change them once, centrally.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: secforge/github/.github/workflows/claude-review.yml@main
    secrets: inherit
